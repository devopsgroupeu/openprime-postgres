name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Helm
    uses: ./.github/workflows/reusable-helm-check.yml

  # helm lint ignores template failures (`required`/`fail`), so the chart's
  # refusal to render without passwords is asserted here instead.
  render-guard:
    name: Chart refuses to render without passwords
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "v3.12.0"

      - name: Template chart with default values must fail
        run: |
          if helm template ci chart > /dev/null 2>&1; then
            echo "::error::chart rendered with no passwords configured"
            exit 1
          fi

  alert-rules:
    name: Alert Rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "v3.12.0"

      # Renders the PrometheusRule as production does and runs the fire and
      # no-fire cases in tests/alert-rules with promtool (via docker).
      - name: Unit-test the alert rules
        run: scripts/test-alert-rules.sh

  image-scan:
    name: Upstream image scan
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-upstream-image-scan.yml

  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
