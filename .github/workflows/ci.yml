name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.12.0"

      - name: Lint chart
        run: helm lint chart

      - name: Template chart (renders with an existing Secret or inline passwords)
        run: |
          helm template ci chart --set auth.existingSecret=ci > /dev/null
          helm template ci chart \
            --set auth.secrets.postgresPassword=a,auth.secrets.openprimePassword=b,auth.secrets.keycloakPassword=c \
            > /dev/null

      # The chart has no default passwords, so the default values must NOT render.
      - name: Template chart (refuses to render without passwords)
        run: |
          if helm template ci chart > /dev/null 2>&1; then
            echo "chart rendered with no passwords configured" >&2
            exit 1
          fi

  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
