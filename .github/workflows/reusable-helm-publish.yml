name: Reusable Helm Publish

# Chart-only variant: bumps the chart version and publishes. Unlike the image-backed
# services, this chart uses upstream images (postgres, amazon/aws-cli), so it does NOT
# rewrite the image repository/tag in values.yaml.

on:
  workflow_call:
    inputs:
      chart-path:
        required: false
        type: string
        default: "./chart"
      version:
        required: false
        type: string
        description: "The version of the Helm chart to publish"
      registry:
        required: false
        type: string
        default: "ghcr.io"
      package-name:
        required: true
        type: string
        description: "The name of the chart package (e.g., openprime-postgres)"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "v3.12.0"

      - name: Log in to Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | helm registry login ${{ inputs.registry }} --username ${{ github.actor }} --password-stdin

      - name: Update Chart Version
        id: update
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-${{ github.sha }}"
          fi

          # Chart version tracks the semantic-release version; the image is upstream
          # and intentionally left untouched.
          sed -i "s/^version:.*/version: ${VERSION}/" ${{ inputs.chart-path }}/Chart.yaml

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package and Push Helm Chart
        run: |
          VERSION="${{ steps.update.outputs.version }}"
          mkdir -p charts/
          helm dependency update ${{ inputs.chart-path }} || true
          helm package ${{ inputs.chart-path }} --destination ./charts/
          helm push ./charts/${{ inputs.package-name }}-${VERSION}.tgz oci://${{ inputs.registry }}/${{ github.repository_owner }}/helm
