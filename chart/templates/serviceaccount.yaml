{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openprime-postgres.serviceAccountName" . }}
  labels:
    {{- include "openprime-postgres.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- if .Values.backup.enabled }}
---
# The backup CronJob's own identity. It carries the IRSA role that may write to
# the backup bucket, which the database pod has no use for. IRSA mounts its own
# projected token, so the Kubernetes API token stays off.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openprime-postgres.fullname" . }}-backup
  labels:
    {{- include "openprime-postgres.labels" . | nindent 4 }}
  {{- with .Values.backup.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}