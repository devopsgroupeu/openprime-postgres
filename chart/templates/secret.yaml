{{- if not .Values.auth.existingSecret }}
{{- $missing := "auth.existingSecret is not set, so auth.secrets.postgresPassword, auth.secrets.openprimePassword and auth.secrets.keycloakPassword are all required. The chart has no default passwords." }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openprime-postgres.secretName" . }}
  labels:
    {{- include "openprime-postgres.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKeys.postgresPassword }}: {{ required $missing .Values.auth.secrets.postgresPassword | b64enc }}
  {{ .Values.auth.secretKeys.openprimePassword }}: {{ required $missing .Values.auth.secrets.openprimePassword | b64enc }}
  {{ .Values.auth.secretKeys.keycloakPassword }}: {{ required $missing .Values.auth.secrets.keycloakPassword | b64enc }}
{{- end }}
