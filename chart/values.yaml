# Default values for openprime-postgres.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Pod Disruption Budget - disabled by default. Postgres runs as a single
# stateful replica here, so enable this only as maxUnavailable: 0 to protect the
# pod from voluntary eviction (node drains then require manual maintenance), or
# switch to an HA operator (CloudNativePG) before using minAvailable.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

image:
  repository: postgres
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # Pinned, and kept equal to appVersion in Chart.yaml: bump the two together.
  # The floating 15-alpine swapped the server binary on whichever restart
  # happened to pull. Stay on Alpine: changing libc under an existing data
  # directory changes collation order, which silently corrupts text indexes.
  # Pinned by digest too (OP-191, H96): a tag can be re-pushed, the digest is
  # what was scanned. Bump tag, digest and appVersion together; CI scans the new
  # reference before it can merge.
  tag: "15.20-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # PostgreSQL never calls the Kubernetes API.
  automount: false

podAnnotations: {}

podSecurityContext:
  fsGroup: 999
  runAsNonRoot: true
  runAsUser: 999

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 999

service:
  type: ClusterIP
  port: 5432
  targetPort: 5432

ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - openprime-postgres
        topologyKey: kubernetes.io/hostname

# PostgreSQL specific configuration
postgresql:
  # Database configuration
  database: "postgres"
  username: "postgres"
  # Default databases to create
  databases:
    - name: "openprime"
      owner: "openprime_user"
    - name: "keycloak"
      owner: "keycloak_user"

  # PostgreSQL configuration parameters
  config:
    max_connections: "200"
    shared_buffers: "256MB"
    effective_cache_size: "1GB"
    maintenance_work_mem: "64MB"
    checkpoint_completion_target: "0.9"
    wal_buffers: "16MB"
    default_statistics_target: "100"
    random_page_cost: "1.1"
    effective_io_concurrency: "200"

# Secrets (should be provided via external secret management)
auth:
  # Use existing secret instead of creating one
  # If set, the chart will not create a secret and will use this one instead
  existingSecret: ""
  # Key in the existing secret containing the postgres password
  secretKey: "postgres-password"
  # Keys for each password, in existingSecret or in the generated Secret. Must be
  # defined so the templates can reference them without a nil-pointer (the values
  # below are also the template's fallbacks).
  secretKeys:
    postgresPassword: "postgres-password"
    openprimePassword: "openprime-user-password"
    keycloakPassword: "keycloak-user-password"
  # Inline passwords the chart wraps into a generated <fullname>-auth Secret when
  # existingSecret is unset. There are no defaults: without existingSecret, all
  # three are required and the chart refuses to render otherwise.
  secrets: {}
  #   postgresPassword: ""
  #   openprimePassword: ""
  #   keycloakPassword: ""
  # The init script sets the openprime_user/keycloak_user passwords only when the
  # data directory is first created. This re-applies them from the Secret on every
  # pod start, which is how a rotated Secret reaches an existing database.
  autoSyncPasswords: false

# Persistent storage
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /var/lib/postgresql/data

# Init scripts
initdb:
  enabled: true
  # Scripts to run during database initialization
  scripts:
    # Create databases and users
    01-init-databases.sh: |
      #!/bin/bash
      set -e

      # Passwords come from the chart's Secret through the environment and reach
      # SQL only as psql variables: :'name' quotes the value, so a password is
      # never spliced into the statement text.
      : "${OPENPRIME_USER_PASSWORD:?is not set - it comes from the chart Secret}"
      : "${KEYCLOAK_USER_PASSWORD:?is not set - it comes from the chart Secret}"

      # Create openprime database and user
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
        -v password="$OPENPRIME_USER_PASSWORD" <<-EOSQL
        CREATE DATABASE openprime;
        CREATE USER openprime_user WITH PASSWORD :'password';
        GRANT ALL PRIVILEGES ON DATABASE openprime TO openprime_user;
        ALTER USER openprime_user CREATEDB;
      EOSQL
      
      # Create keycloak database and user with proper permissions
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
        -v password="$KEYCLOAK_USER_PASSWORD" <<-EOSQL
        CREATE DATABASE keycloak;
        CREATE USER keycloak_user WITH PASSWORD :'password';
        GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak_user;
        ALTER USER keycloak_user CREATEDB;
      EOSQL
      
      # Connect to keycloak database and grant schema permissions
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "keycloak" <<-EOSQL
        GRANT ALL ON SCHEMA public TO keycloak_user;
        GRANT CREATE ON SCHEMA public TO keycloak_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO keycloak_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO keycloak_user;
      EOSQL
      
      # Connect to openprime database and grant schema permissions  
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "openprime" <<-EOSQL
        GRANT ALL ON SCHEMA public TO openprime_user;
        GRANT CREATE ON SCHEMA public TO openprime_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO openprime_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO openprime_user;
      EOSQL

# Health check configuration
healthCheck:
  enabled: true
  livenessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - exec pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    exec:
      # Ready only when all three databases accept connections. Must be a single
      # `sh -c` script: extra list items after the first are $0/$1, not commands,
      # and `exec` would replace the shell before the later checks ran.
      command:
        - /bin/sh
        - -c
        - >-
          pg_isready -U postgres -d postgres -h 127.0.0.1 -p 5432 &&
          pg_isready -U postgres -d openprime -h 127.0.0.1 -p 5432 &&
          pg_isready -U postgres -d keycloak -h 127.0.0.1 -p 5432
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Network policies
networkPolicy:
  enabled: false
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openprime-app-backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openprime-keycloak
  egress: []
# Interim backups for OP-167. Off by default: turning this on requires a bucket
# and S3 credentials, so it must be an explicit choice per environment.
#
# This is a stopgap, not durability. No HA, no PITR - it converts total data
# loss into loss-since-last-dump while the managed-vs-operator decision is made.
#
# Credentials: annotate the backup ServiceAccount (<fullname>-backup) with an
# IRSA role that can PutObject into `bucket`/`prefix`
# (backup.serviceAccount.annotations). Not serviceAccount.annotations: that one
# belongs to the database pod. Do not mount static keys.
#
# Retention: set a lifecycle rule on the bucket. Deliberately not done here, so
# it survives this chart being uninstalled.
backup:
  enabled: false
  schedule: "0 2 * * *"
  bucket: ""
  prefix: "openprime-postgres"
  region: "eu-west-1"
  # Superuser, so pg_dumpall can read roles and every database.
  user: "postgres"
  # Floor for a plausible dump. A successful connection that returns almost
  # nothing still produces a valid gzip, so size is the only cheap guard.
  minBytes: 4096
  # Attempts after the first, spaced by Kubernetes' exponential back-off
  # (10s, 20s, 40s, ...): 3 rides out about a minute of database or S3
  # unavailability. 0 disables retries.
  backoffLimit: 3
  # Pinned by digest (OP-191, H96); bump tag and digest together.
  awsCliImage: "amazon/aws-cli:2.42.1@sha256:b0102d2269f87d8531d931c1a59e248101ace586886e6c077058d94c1c37b846"
  serviceAccount:
    # e.g. eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<backup-role>
    annotations: {}
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Alert rules for this database (OP-278): a PrometheusRule for the Prometheus
# Operator, rendered only on clusters that serve monitoring.coreos.com/v1.
# Off by default. The cluster's Prometheus loads only the rules its ruleSelector
# matches, and a rule it does not select is silently ignored: kube-prometheus-
# stack selects its own release label, so set e.g.
#   additionalLabels:
#     release: kube-prometheus-stack
# The rules read kube-state-metrics series (kube_deployment_*, kube_job_*,
# kube_cronjob_*), so the cluster has to run kube-state-metrics.
prometheusRule:
  enabled: false
  additionalLabels: {}
  # OpenPrimePostgresDown: how long the Deployment may have no available pod.
  # A rollout (strategy Recreate) takes the database down for about a minute,
  # so a deploy can fire it; see the comment on the rule.
  downFor: 1m
  # OpenPrimePostgresBackupMissing (only with backup.enabled): no successful
  # backup for this many hours, a whole number. Daily schedule plus 2 hours
  # for a slow or retried run.
  backupMaxAgeHours: 26
